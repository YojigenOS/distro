# server —— 服务器
#
# **2026-10-22 建。** 而它现在是**很薄的一层**，理由说清楚：
#
#   `server` = `minimal` + sshd 自启（+ 将来的硬化）
#
# `minimal` 已经有 46 个包，其中 chrony / cronie / logrotate / sudo / tzdata
# 都在 —— 也就是说"服务器该有的那些东西"它本来就有，差别只在【要不要自动起】。
#
# ★ 所以这个文件用 `extends` 而不是复制那 46 行：复制的那份会漂移，而漂移的
#   症状是"server 少了 minimal 后来加的那个包"，很难在事后看出来。
#
# ── "自启"这件事为什么写在这里，而不是写在 openssh 那个包里 ──────────────
#
# 决策记录 0024：**服务由风味启用，包只提供定义。** 同一个 openssh 包，
# minimal 要它起来、base（容器）不要 —— 那是风味该回答的问题。

[variant]
name        = "server"
extends     = "minimal"
kind        = "disk"
description = "服务器：minimal + sshd 自启（硬化那一层还没做）"

# ★ 现在只有 sshd 有服务定义。chrony / cronie 那两个还没有 —— 而
#   `services` 里写一个没有定义的名字会在【组装时当场失败】（见 root.py 那段
#   校验），那是对的：写在这里的每一个名字都得真的能起。
services = ["sshd"]

# ★★ /bin/sh 用 bash，不用 dash（2026-10-22 定的）。
#
#   理由是一条具体的：1Panel 的 `/etc/init.d/1panel-core` 在 `#!/bin/sh` 里写了
#   bash 数组（`local rc_dirs=( … )`）。dash 不认，于是那个服务**装了但重启之后
#   起不来**（`Syntax error: "(" unexpected`）。
#
#   而这不是推翻 dash 那次决定 —— `dash` 配方里那条理由仍然成立（"只要 /bin/sh
#   是 bash，大家就会用扩展"）。所以 base / devel / minimal **仍然是 dash**，
#   只有 server 换：它是【要跑别人写的安装脚本】的那一类，而那些脚本大多假设
#   bash（RHEL 系就是这样，1Panel 的用户也大多在那儿）。
#
#   ★ 两个 binsh 包都装会撞同一个文件 usr/bin/sh，所以必须 exclude 父的那一个。
exclude  = ["dash-binsh"]
packages = [
    "bash-binsh",

    # ── 第 0 期：仓库里已经有、但一直没进风味的（2026-10-25）──────────────
    #
    # ★ 对标 Fedora Server 的 core + standard 两组之后发现的：
    #   这些包【早就建出来了】，只是没人把它们写进风味清单 ——
    #   于是装完的系统里没有 `dig`、没有 `nft`、没有 D-Bus。
    #
    # ★★ 判据（Fedora comps 里怎么分类，我们就怎么分）：
    #
    #   dbus        standard 组成员。没有它，systemd 的很多可选能力
    #               （logind/polkit/networkd）全都起不来；而 1Panel 那种
    #               装完就想要 D-Bus 的软件会静默地少功能。
    #   nftables    Fedora 的 firewall 底座。我们有 iptables（nft 后端），
    #               但 `nft` 命令本身没装 —— 而它才是 settable 的原生写法。
    #   tcpdump     排障必需。minimal 里没有，而 server 上抓包是常事。
    #   perl        Fedora 的 core 组成员（perl-interpreter）。我们 build
    #               工具链大量依赖它，装一个在系统上不亏。
    #   gettext     NLS 的运行时（libintl + msgfmt）。中文优先的前提 ——
    #               装它之后 `--disable-nls` 才真的没有借口。
    #
    # ★ 而 Fedora 的 standard 里还有一堆我们【暂时没有配方】的
    #   （bind-utils/netcat/traceroute/pciutils/man-db 等），
    #   那些是第 1 期的事，不在这里。
    "dbus",
    "nftables",
    "tcpdump",
    "perl",
    "gettext",

    # ── 第 1 期：对标 Fedora Server 的 standard 组，新补的 13 个（2026-10-26）──
    #
    # ★ 判据（YG 第 1 条"基础包要全"）：Fedora 的 core + standard 两组里
    #   我们有对应物的已经全在 minimal 里了；这 13 个是我们原来【没有配方】的。
    #
    # ★★ 排障那一组是重点 —— 没有它们的系统"查不了问题"：
    #
    #   bind9       dig / host / nslookup —— DNS 出问题时第一把工具。
    #               它带 3 个依赖（libuv / liburcu / lmdb），链是我们目前最长的。
    #   pciutils    lspci —— 看不到硬件就没法判断"驱动加载了吗"
    #   usbutils    lsusb —— 同上，USB 那一侧
    #   traceroute  网络不通时定位在哪一跳
    #
    # ★ 而标准工具那一组：
    #   acl attr    getfacl/setfacl · getfattr/setfattr —— POSIX ACL 是
    #               "文件权限"的一部分，没有它们 `+` 号那一格是空的
    #   ed          POSIX 标准编辑器（一些 build 脚本和 patch 用）
    #   tree whois 日常
    #   dos2unix    Windows 换行符转换
    "bind9",
    "pciutils",
    "usbutils",
    "traceroute",
    "acl",
    "attr",
    "ed",
    "tree",
    "whois",
    "dos2unix",

    # ── 第 4 期（上）：服务器运维四件套（2026-10-26）────────────────────
    #
    # ★ 这四个是"一台服务器该有的诊断能力"，都属 Fedora 的 standard 组。
    #
    #   ethtool        网卡：速率/双工/丢包/固件版本。`ip link` 只看得到
    #                  UP/DOWN，看不到**为什么**慢。
    #   parted         分区：我们的交付是 DD 一个 rootfs（0013），
    #                  扩盘之后 `parted resizepart` 是最直接的路 —— fdisk 做不了。
    #   smartmontools  磁盘健康：一台服务器最怕的不是"坏了"，是"坏了才知道"。
    #   mdadm          软件 RAID：两块盘做镜像是最常见的起点，纯软件实现。
    #
    # ★ 四个都在 TX 上验过产物（构建通过、包进仓库）。
    "ethtool",
    "parted",
    "smartmontools",
    "mdadm",

    # ★ 第 4 期（下）：加密盘（2026-10-26）
    #
    #   cryptsetup   LUKS 磁盘加密 —— 全盘加密是标准运维实践，而 LUKS 是
    #                Linux 上唯一的格式。**它同时解开 systemd 的
    #                `-Dlibcryptsetup`**（那个关着时不能读 /etc/crypttab，
    #                也就是"开机自动解锁加密盘"做不到）。
    #
    #   ★ 它带两个前置：json-c（LUKS2 元数据是 JSON）和 libdevmapper
    #     （从 LVM2 源码树只编 libdm 那一层）。两个都进了仓库。
    "cryptsetup",

    # ★ 第 4 期（下）：签名与加密（2026-10-26）
    #
    #   gnupg   gpg —— 包签名验证（我们的 apk 仓库就是签名的）、加密通信、
    #           `git commit -S` 签提交。它是 B 类里依赖最重的：5 个前置库
    #           （libgpg-error / libgcrypt / libassuan / libksba / npth）+ sqlite。
    #
    #   ★ 实测 TX 上：生成密钥 / 加密 / 解密（中文无损）/ 签名验证 全通。
    "gnupg",

    # ★ 第 5 期盘点后补的最后两个"真缺"（2026-10-26）
    #
    #   at       一次性定时任务（atd）。和 cron 的分工：cron 是周期性，
    #            at 是一次性（"过 30 分钟重启一下"）。
    #   mailcap  MIME 类型映射表（纯数据包）。
    #
    # ★ `at` 的落地花了八个坑 —— 从编译期的 SENDMAIL 假设，到运行期的
    #   spool 属主 / service Type / 降权 / PAM 配置。判据从头到尾只有一个：
    #   **排一个任务，等一分钟，看它跑没跑**。
    "at",
    "mailcap",
]
