# base —— 容器基础镜像
#
# 定位写在 docs/决策记录/0013 和 0007 里：一个**能当 docker 容器用**的最小
# 运行时。同类是 alpine、debian:slim——但它是 glibc 那一侧的。
#
# 实测 17 MB（tar.gz）。对照：debian:stable-slim 是 28.8 MB。
#
# 这张列表是**唯一出处**。在这之前它是写在 CI workflow 里的，加了 gettext
# 之后那份就悄悄漏了它——同一个东西两个出处，只有一个会被改。

[variant]
name        = "base"
kind        = "container"
description = "容器基础镜像：glibc + dash + 核心命令 + 中文 locale"

packages = [
  # 目录骨架。必须最先——它提供 /usr、/etc、以及 /lib → usr/lib 这些
  # usr-merge 链接，后面每个包的 ELF 里写死的 interpreter 路径都靠它解析。
  "filesystem",

  # C 库。glibc-locales 是单独拆出来的（约 9 MB）：没有它中文显示不出来，
  # 而它是「中文优先」在产物层面最直接的体现。
  "glibc",
  "glibc-locales",

  # shell。/bin/sh 指向 dash（POSIX），不是 bash。
  #
  # ★ 为什么用 dash-binsh 而不是 bash：
  #
  #   它提供 /bin/sh，而且指向一个【真正的 POSIX shell】。这样别人写
  #   #!/bin/sh 的脚本在我们这儿和在 Debian 上行为一致——不会偷偷用上
  #   bash 扩展、换台机器就炸。原来 filesystem 直接建 /bin/sh → bash，
  #   那个陷阱是我们这一侧造的。
  #
  #   Debian 1999 年把 /bin/sh 从 bash 换成 dash，主要理由就是这个：不是
  #   性能，是【纪律】——只要 /bin/sh 是 bash，大家就会用扩展。
  #
  #   完整说明见 packages/recipes/tool/dash/spec.toml。
  #
  # ★ 要 bash 的话它还在仓库里，apk add bash 就有。它不该是基础镜像的默认。
  #
  # ★ dash-binsh 依赖 dash（子包依赖主包），所以只列这一个就够。
  "dash-binsh",

  # 核心命令。这一组决定了这个镜像「能不能用」。
  "coreutils",
  "sed",
  "grep",
  "gawk",
  "findutils",
  "diffutils",
  "tar",
  "gzip",
  "xz",

  # ---- 包管理器与它的信任链 ----
  #
  # apk-tools 是 0006 那条路的终点：在这之前系统有包的格式和建包的工具
  # （mkpkg/mkndx/adbsign 都是 apk 自己的），但没有客户端。有了它，base 才能
  # 自己装软件。
  #
  # ★ ca-certificates 是它的【运行时依赖】，不是可选项：apk 用 OpenSSL 的
  #   libfetch 取仓库、验 TLS 证书链（strings libapk 能看到
  #   SSL_CTX_load_verify_locations 和 Verify hostname）。少了它，apk 能跑但
  #   连不上任何 https 仓库——而这个系统里所有仓库都是 https。
  #
  # ★ openssl 不在这个列表里：apk-tools 的 runtime 依赖写的是 libssl 和
  #   libcrypto 两个【子包】，它们会跟进来。openssl 主包（命令行 + 开发文件，
  #   17 MB）不会——实测那样 base 会多带 24 MB 而不是 6.6 MB。
  "apk-tools",
  "ca-certificates",
]
