# minimal —— 最小可启动系统
#
# 决策记录 0007 给它的定位是【两格都占】：同一套用户态，既能 `docker run`
# 当容器用（取代 Alpine 那个位置），也能启动成一台真机器（救援系统 / 服务器
# 的底子）。Alpine 就是这么干的。
#
# 这一版只做【磁盘】那一格——因为 0013 决定的第一件事是"能 DD 到腾讯云上"。
# 容器那一格等以后再说：`kind` 现在只能写一个值，表达"两格都要"是 0007 的
# 待定项，等真有第二个形式要实现时再改成 `[variant.formats.*]`。
#
# ── 为什么现在就能列出来 ────────────────────────────────────────────────
#
# 这张列表是【目标】，不是【现状】。跑一次 `pantsu rootfs minimal` 会告诉你现在
# 卡在哪一档 —— 而 2026-10-15 按这张表真跑了一次（aarch64，线上仓库），
# **原来那三档里一档都没剩下**：
#
#   ✅ 有配方、线上也有   下面 20 个包全都拿得到、装得上。
#                         grub · openssh · dhcpcd 三份配方是这一轮补齐的
#                         （原来这一档写的是"还没有配方"）；apk-tools 那条
#                         构建链（packages 的待办 5.8）同样已经做完。
#   ⚠️ 线上比配方旧       linux 装到的是 7.2.9-r1，而配方已经走到 r3 ——
#                         装得出来，只是拿到的是上一次发布的那一版。要拿新的
#                         得先跑 packages 的 release workflow 重新发布。
#
# ★ 装出来是 30 个包：这 20 个 + 依赖带进来的（bash · e2fsprogs · libxcrypt ·
#   libcap-ng · gmp …）。**哪些是依赖带进来的，以装出来的那份
#   `/etc/yojigen-os-manifest` 为准**，别从这张列表推。
#
# ── 和 base.toml 有重复，这是故意的 ──────────────────────────────────────
#
# 前面那 14 个（一直排到 xz）和 base.toml 一模一样。0007 的待定项 #1 讨论过
# "增量写法还是完整列表"，倾向还没定；这里选完整列表，因为**读一个文件就知道
# 这个系统里有什么**，而增量写法要跳两个文件才能回答同一个问题。
# 等第二个可启动风味出现，重复变成三份的时候再抽。

[variant]
name        = "minimal"
kind        = "disk"
description = "最小可启动系统：能开机、能串口、能 SSH"

packages = [
  # ── 用户态：和 base 同一套 ──────────────────────────────────────────
  # 目录骨架最先——它提供 /usr、/etc，以及 /lib → usr/lib 这些 usr-merge
  # 链接，后面每个包的 ELF 里写死的 interpreter 路径都靠它解析。
  "filesystem",
  # ★ apk-tools 必须在【被装进盘里的】那一侧。
  #
  #   没有它，系统起来了但【装不了任何软件】：
  #     · /etc/apk/repositories   有（组装时写进去了）
  #     · /etc/apk/keys/          有（公钥烤进去了）
  #     · /lib/apk/db/installed   有（装的时候留下的数据库）
  #     · 但 /sbin/apk            ✗ 没有
  #
  #   ★ 没有任何配方依赖它——它不会被依赖带进来，只能显式声明。
  #     base.toml 里是显式写了的，minimal 里漏了。
  "apk-tools",
  "glibc",
  # 中文优先在产物层面最直接的体现。它是**独立子包**，所以"要不要翻译"
  # 就是这一行的事——原来那套"拼装期删 61 种语言的 .mo"因此没有了。
  "glibc-locales",

  # /bin/sh 指向真正的 POSIX shell（dash），不是 bash。理由见 base.toml。
  "dash-binsh",

  "coreutils",
  "sed",
  "grep",
  "gawk",
  "findutils",
  "diffutils",
  "tar",
  "gzip",
  "xz",

  # ── 启动链 ────────────────────────────────────────────────────────
  # /init ——内核把控制权交给用户空间之后跑的第一个程序。
  "yojigen-os-init",
  # mount / blkid / agetty / sfdisk。前两个是 /init 自己要用的（它已经在
  # 依赖里声明了），后两个是"人能看到输出"和"将来首启扩容"要用的。
  "util-linux",
  # 内核。包里带着 /boot/vmlinuz——磁盘镜像那条路要把它放进 /boot，
  # 所以它必须是【风味里的一个包】，不是一个构建时的外部依赖。
  # 注意它和 linux-headers 是同一份 tarball、同一个 sha256。
  "linux",

  # ── 引导器 ────────────────────────────────────────────────────────
  # ★ 它既是"构建镜像时要跑的工具"（grub-install 往 bios_grub 分区里写
  #   core.img），也是"要落进镜像的文件"（/boot/grub 里的模块，GRUB 运行
  #   时要读）。所以它是包，不是组装脚本里的一个外部命令。
  #   代价：它的 i386-pc 目标是 32 位 x86 代码，gcc 得开 multilib。
  "grub",

  # ── 远程 ──────────────────────────────────────────────────────────
  # 决策记录 0008：可启动的镜像默认带 openssh。没有它，机器只能"盯着看"
  # 不能"驱动"——串口控制台跑不了脚本、传不了文件。
  #
  # 落地时有两件事在 packages 那一侧（写配方的人别忘）：
  #   1. sshd 需要特权分离用户 `sshd`，而 shadow 包还没建。最省的办法是
  #      打包时静态写进 /etc/passwd + 建 /var/empty。
  #   2. host key 在首启生成（见 yojigen-os-firstboot 那一类包），不是烤进
  #      镜像的——同一个 host key 发给所有人等于没有。
  "openssh",
  # 没有它镜像起来是没有 IP 的：sshd 起来了但谁也连不上，
  # 而云主机没有串口。见 recipes/net/dhcpcd/spec.toml 那段。
  "dhcpcd",

  # ── 这一格现在空着 ────────────────────────────────────────────────
  # 原来这里列着两件"还没进来，但迟早要"的事。2026-10-15 核过，两件都已经落地：
  #   · apk-tools —— 就在上面（「必须在【被装进盘里的】那一侧」那段），线上也有。
  #     它那条构建链 perl → openssl → curl → ca-certificates 也已经做完（待办 5.8 ✅）。
  #   · 首启那几段脚本（撑根分区、起网络、生成 host key）——它们最后【没有】
  #     做成一个单独的"首启包"，而是各自跟着要用它的那个包走，按
  #     /usr/lib/yojigen-os/boot.d/ 的约定排队跑：10-grow-root 和 05-hostname
  #     在 yojigen-os-init 里、15-network 在 dhcpcd 里、host key 在 openssh 里。
  #     三个包都已经在上面。
]
