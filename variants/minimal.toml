# minimal —— 最小可启动系统
#
# 决策记录 0007 给它的定位是【两格都占】：同一套用户态，既能 `docker run`
# 当容器用（取代 Alpine 那个位置），也能启动成一台真机器（救援系统 / 服务器
# 的底子）。Alpine 就是这么干的。
#
# 这一版只做【磁盘】那一格——因为 0013 决定的第一件事是"能 DD 到腾讯云上"。
# 容器那一格等以后再说：`kind` 现在只能写一个值，表达"两格都要"是 0007 的
# 待定项，等真有第二个形式要实现时再改成 `[variant.formats.*]`。
#
# ── 为什么现在就能列出来 ────────────────────────────────────────────────
#
# 这张列表是【目标】，不是【现状】。跑一次 `pantsu rootfs minimal` 会告诉你现在
# 卡在哪一档 —— 而 2026-10-15 按这张表真跑了一次（aarch64，线上仓库），
# **原来那三档里一档都没剩下**：
#
#   ✅ 有配方、线上也有   下面 20 个包全都拿得到、装得上。
#                         grub · openssh · dhcpcd 三份配方是这一轮补齐的
#                         （原来这一档写的是"还没有配方"）；apk-tools 那条
#                         构建链（packages 的待办 5.8）同样已经做完。
#   ⚠️ 线上比配方旧       linux 装到的是 7.2.9-r1，而配方已经走到 r3 ——
#                         装得出来，只是拿到的是上一次发布的那一版。要拿新的
#                         得先跑 packages 的 release workflow 重新发布。
#
# ★ 装出来是 30 个包：这 20 个 + 依赖带进来的（bash · e2fsprogs · libxcrypt ·
#   libcap-ng · gmp …）。**哪些是依赖带进来的，以装出来的那份
#   `/etc/yojigen-os-manifest` 为准**，别从这张列表推。
#
# ── 和 base.toml 有重复，这是故意的 ──────────────────────────────────────
#
# 前面那 14 个（一直排到 xz）和 base.toml 一模一样。0007 的待定项 #1 讨论过
# "增量写法还是完整列表"，倾向还没定；这里选完整列表，因为**读一个文件就知道
# 这个系统里有什么**，而增量写法要跳两个文件才能回答同一个问题。
# 等第二个可启动风味出现，重复变成三份的时候再抽。

[variant]
name        = "minimal"
kind        = "disk"
description = "最小可启动系统：能开机、能串口、能 SSH"

packages = [
  # ── 用户态：和 base 同一套 ──────────────────────────────────────────
  # 目录骨架最先——它提供 /usr、/etc，以及 /lib → usr/lib 这些 usr-merge
  # 链接，后面每个包的 ELF 里写死的 interpreter 路径都靠它解析。
  "filesystem",
  # ★ apk-tools 必须在【被装进盘里的】那一侧。
  #
  #   没有它，系统起来了但【装不了任何软件】：
  #     · /etc/apk/repositories   有（组装时写进去了）
  #     · /etc/apk/keys/          有（公钥烤进去了）
  #     · /lib/apk/db/installed   有（装的时候留下的数据库）
  #     · 但 /sbin/apk            ✗ 没有
  #
  #   ★ 没有任何配方依赖它——它不会被依赖带进来，只能显式声明。
  #     base.toml 里是显式写了的，minimal 里漏了。
  "apk-tools",
  "glibc",
  # 中文优先在产物层面最直接的体现。它是**独立子包**，所以"要不要翻译"
  # 就是这一行的事——原来那套"拼装期删 61 种语言的 .mo"因此没有了。
  "glibc-locales",

  # /bin/sh 指向真正的 POSIX shell（dash），不是 bash。理由见 base.toml。
  "dash-binsh",

  "coreutils",
  "sed",
  "grep",
  "gawk",
  "findutils",
  "diffutils",
  "tar",
  "gzip",
  "xz",

  # ── 启动链 ────────────────────────────────────────────────────────
  # /init ——内核把控制权交给用户空间之后跑的第一个程序。
  "yojigen-os-init",
  # mount / blkid / agetty / sfdisk。前两个是 /init 自己要用的（它已经在
  # 依赖里声明了），后两个是"人能看到输出"和"将来首启扩容"要用的。
  "util-linux",
  # ★ kbd 是为了 setkeycodes 进来的（2026-10-16）。
  #
  #   云主机没有 PS/2 键盘，而 VNC 控制台发的按键事件照样落到 i8042 上，
  #   于是 atkbd 每次按键刷两条 "Unknown key"。`setkeycodes 00 255` 是内核
  #   设计里的正解（255 = ATKBD_KEY_NULL = 静默），而那个命令属于 kbd。
  #
  #   ★ 而它【不只是】为这一条噪音：这个包还带 loadkeys / dumpkeys / showkey /
  #     kbd_mode / chvt / openvt —— 控制台键盘映射和虚拟终端迟早要用。
  #     见 packages/docs/待办.md 里那一条。
  #
  #   它的启动钩子由包自己装（usr/lib/yojigen-os/boot.d/08-console-keyboard）。
  "kbd",
  # 内核。包里带着 /boot/vmlinuz——磁盘镜像那条路要把它放进 /boot，
  # 所以它必须是【风味里的一个包】，不是一个构建时的外部依赖。
  # 注意它和 linux-headers 是同一份 tarball、同一个 sha256。
  "linux",

  # ── 引导器 ────────────────────────────────────────────────────────
  # ★ 它既是"构建镜像时要跑的工具"（grub-install 往 bios_grub 分区里写
  #   core.img），也是"要落进镜像的文件"（/boot/grub 里的模块，GRUB 运行
  #   时要读）。所以它是包，不是组装脚本里的一个外部命令。
  #   代价：它的 i386-pc 目标是 32 位 x86 代码，gcc 得开 multilib。
  "grub",

  # ── 远程 ──────────────────────────────────────────────────────────
  # 决策记录 0008：可启动的镜像默认带 openssh。没有它，机器只能"盯着看"
  # 不能"驱动"——串口控制台跑不了脚本、传不了文件。
  #
  # 落地时有两件事在 packages 那一侧（写配方的人别忘）：
  #   1. sshd 需要特权分离用户 `sshd`，而 shadow 包还没建。最省的办法是
  #      打包时静态写进 /etc/passwd + 建 /var/empty。
  #   2. host key 在首启生成（见 yojigen-os-firstboot 那一类包），不是烤进
  #      镜像的——同一个 host key 发给所有人等于没有。
  "openssh",
  # 没有它镜像起来是没有 IP 的：sshd 起来了但谁也连不上，
  # 而云主机没有串口。见 recipes/net/dhcpcd/spec.toml 那段。
  "dhcpcd",

  # ── 常用工具：让这个系统【能干活】，不只是【能开机】 ────────────────
  #
  # 2026-10-16 加的。起因是在真机上发现：SSH 进去之后 ps 没有、vi 没有、
  # curl 没有 —— 这台机器能开机、能串口、能 SSH，而【做不了任何事】。
  #
  # ── 判据：和 Alpine 的 minirootfs 对标 ─────────────────────────────
  #
  # 0007 给这个风味的定位是"取代 Alpine 那个位置"。那就该问：**Alpine 的
  # minirootfs 里有什么？** 答案是 8 个包（alpine-baselayout · alpine-keys ·
  # alpine-release · apk-tools · busybox · busybox-binsh ·
  # ca-certificates-bundle），而其中 busybox 【一个包提供了 304 个 applet】——
  # ps / top / free / vi / less / wget / ping / ifconfig / route / su / dd /
  # mount / grep / awk / which / bc / lsof / hostname / tee / cut / sort …
  #
  # ★ 而那 304 个【就是"常用"的定义】—— 一个 Alpine 用户 ssh 进去，那些命令
  #   都在。而代价是【它们是精简版】：busybox 的 ls 没有 --color，vi 是个
  #   极简的，ps 只认那几个选项。
  #
  # ★★ 我们【选了真东西】（coreutils · grep · sed · gawk · findutils …），
  #    所以【每一个都得显式装】—— 没有"一个包白拿几十个"这回事。
  #    这份列表就是那个差额的填法：**把 busybox 那些 applet 换成真工具**。
  #
  # ★★★ 而它也解释了为什么这一格看起来"短"却不算缺陷：Alpine 的短是
  #     busybox 替它长的，而我们的长要自己写出来。**这不是 bug，是对标的代价。**
  #
  # ── 为什么不加那些大的 ──────────────────────────────────────────
  #
  # python3 / perl / gcc / tcpdump / 桌面那一套 —— Alpine 的 minirootfs 里
  # 同样没有，而它们要 `apk add`。这里跟着它：**要的人自己装**，因为
  # python3 一个就比上面这一整批还大。这个风味的名字是 minimal。

  # 进程与内存：ps · top · free · uptime · vmstat · kill 的一部分。
  # ★ 最要紧的一条 —— 没有 ps，机器"活了但看不见里面"。
  "procps",
  # 看文件。less 而不装 more：more 是 less 的一个子集，而 busybox 两个名字
  # 都给了。
  "less",
  # 改文件。★ 没有它，ssh 进去【改不了任何一个文件】—— 而那是今晚在真机上
  # 卡住的第二件事（想看一眼 grub.cfg，没有编辑器）。
  "vim",
  # 认文件类型（file xxx 会说"这是 ELF 还是文本"）。
  "file",
  # `which` —— 脚本里最常用的那一句。
  "which",
  # 算数。shell 的 $(( )) 只支持整数，而 bc 支持小数和进制。
  "bc",

  # ── 网络 ────────────────────────────────────────────────────────
  # ★ 下东西。curl 而不是 wget：curl 在依赖链上（apk-tools 那条链要它），
  #   所以它本来就该在；而 wget 是个【独立包】—— 见下面的待办。
  #
  #   ★ 而这条是今晚的实际教训：reinstall.sh 想下东西时用的是 wget，
  #     而它在我们系统上找不到。curl 能下，但【那个名字】换不了。
  "curl",
  # ping。而它带来 iputils 那套（ping · ping6 · tracepath）。
  "iputils",
  # ip / ss / route。★ ifconfig 和 route 在 busybox 里，而它们已经是过时的
  # 接口了 —— 真工具是 ip 那一套。
  "iproute2",

  # ── 权限 ────────────────────────────────────────────────────────
  # su。它在这个包里（shadow 提供 su + 那套 useradd/groupadd/passwd）。
  # ★ 而它同时带来 /etc/shadow 那套工具 —— 首启建用户要用。
  "shadow",
  # sudo。★ Alpine 的 minirootfs 【没有】它（它要 apk add）—— 这里加上
  # 是因为"以 root 登进去"这件事本身就该尽量少做。
  "sudo",

  # ── 排错 ────────────────────────────────────────────────────────
  # 谁开着这个文件。
  "lsof",
  # 这个程序在干什么（一个命令看系统调用）。
  "strace",

  # ── 归档 ────────────────────────────────────────────────────────
  # ★ 上面已经有 tar/gzip/xz，而这两个是"迟早要"的：zstd 现在到处都是
  #   （我们的镜像自己就是 .zst），bzip2 是 bz2 那批老包。
  "zstd",
  "bzip2",
  # cpio —— initramfs 的格式。★ /init 那套将来要建 initramfs 时用得上，
  #   而它很小。
  "cpio",

  # ── 时间与证书 ──────────────────────────────────────────────────
  # ★ ca-certificates —— 没有它【https 全是失败】，而 curl 要它。
  #   这是个"看起来不该漏"的漏：原来这一格里没有它。
  "ca-certificates",
  # 时区数据库（/usr/share/zoneinfo）。★ 没有它 date 只能说 UTC。
  "tzdata",
  # ★ chrony —— 云主机的时钟会漂，而 TLS 和 ssh 都吃时钟。
  #   它自带 20-chrony 那个启动钩子（同 kbd 的 08-console-keyboard 一类）。
  "chrony",

  # ── 会话与维护 ──────────────────────────────────────────────────
  # tmux。★ Alpine 的 minirootfs 没有它 —— 而 ssh 断线时它救过很多人。
  "tmux",
  # 拷东西（比 cp 快，能续传，能镜像）。
  "rsync",
  # 定时任务 + 日志轮转。两个都很小，而"上了真机"之后迟早要用。
  "cronie",
  "logrotate",
  # 看一眼系统（它是"欢迎来到 Yojigen OS"之外最便宜的那个"这机器是什么"）。
  "fastfetch",

  # ── 待办：这里【该有】而现在没有配方的 ────────────────────────────
  #
  # ★ wget —— 上面选了 curl，而 wget 是【另一个名字】。今晚实测：
  #   reinstall.sh 下东西时调的是 wget，找不到就跳过那一步。curl 能替代
  #   功能，替代不了"脚本里写着 wget"这件事。要写配方。
  # ★ virt-what（+ dmidecode）—— 判断"是不是虚拟机"。今晚 DD 四次尝试里
  #   三次失败是因为它装不上，于是脚本判断不出 KVM，选了通用的内核模块。
  #   要写配方。
  # ★ dmidecode —— virt-what 的依赖，一起。
  # ★ dosfstools（mkfs.vfat）· parted（分区）· nftables（防火墙）·
  #   unzip —— 各自场景明确，都还没有配方。
  # ★ 而 git 该进 devel，不是这里。

  # ── 这一格现在空着 ────────────────────────────────────────────────
  # 原来这里列着两件"还没进来，但迟早要"的事。2026-10-15 核过，两件都已经落地：
  #   · apk-tools —— 就在上面（「必须在【被装进盘里的】那一侧」那段），线上也有。
  #     它那条构建链 perl → openssl → curl → ca-certificates 也已经做完（待办 5.8 ✅）。
  #   · 首启那几段脚本（撑根分区、起网络、生成 host key）——它们最后【没有】
  #     做成一个单独的"首启包"，而是各自跟着要用它的那个包走，按
  #     /usr/lib/yojigen-os/boot.d/ 的约定排队跑：10-grow-root 和 05-hostname
  #     在 yojigen-os-init 里、15-network 在 dhcpcd 里、host key 在 openssh 里。
  #     三个包都已经在上面。
]
