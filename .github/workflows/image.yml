# 建盘、启动一次、发布
#
# 这是 distro 侧的第一个 workflow。四步：
#
#     1. 从 apk 仓库装出一个根             pantsu rootfs
#     2. 做成一张能 DD 的磁盘镜像           pantsu img
#     3. 在 QEMU 里【真启动它】             pantsu vm --expect …
#     4. 推进仓库                          pantsu publish --go（只在勾了发布时）
#
# ── 为什么第 3 步是这里最值钱的一步 ──────────────────────────────────────
#
# 前两步"成功"过很多次，产物却起不来：GRUB 的 EFI 模块集里少个 part_gpt、
# 文件系统比分区大了 1 MiB、console= 的顺序反了、根设备写成了内核根本不认的
# UUID……全是【建得出、看不出来、只有在 QEMU 里真启动才暴露】的那一类。
#
# 所以这个 workflow 的验收不是"文件生成了"，而是"它启动到打印出那句话"。
# 断言用的那句话（欢迎来到 Yojigen OS）来自 yojigen-os-init 包里真正的 /init
# ——所以它一路证明了：仓库里的包、装出来的根、建出来的盘、引导器、内核，
# 整条链都是活的。
#
# ── 为什么 action 用版本号（而不是像 packages 那样钉 hash）──────────────
#
# packages 那边钉的是 commit SHA（配 Dependabot 管）。这里按项目要求用版本号：
# 可读，一眼看得出来用的是哪一代。
#
# ── 关于加速 ────────────────────────────────────────────────────────────
#
# QEMU 有 KVM 就用 KVM，没有就退回 TCG（纯模拟，慢好几倍）。GitHub 托管的
# runner 通常【没有】/dev/kvm，所以下面给的时间比较宽——TCG 下启动一次
# 要几分钟是正常的。

# ★ 和 release.yml 是两条线，不是一件事：
#
#     release.yml   仓库 → 组装 → 容器交付物 → registry
#     image.yml     仓库 → 组装 → 【磁盘镜像】→ repo.os.yojigen.cn（DD 用）
#
# 名字刻意不叫"镜像"：这个项目里"镜像"默认指容器镜像。
name: 磁盘镜像

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '风味（variants/*.toml 里的名字）'
        required: true
        type: choice
        options: [minimal, base, base-devel]
        default: minimal
      arch:
        description: '架构'
        required: true
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
      size:
        description: '镜像虚拟大小。装到 40G 的盘上之后，多出来的空间暂时没人管（0013 还没定 #2）'
        required: false
        default: '1G'
      deploy:
        description: '真的推送到 repo.os.yojigen.cn（不勾就是干跑，产物留在 Actions 里）'
        required: false
        type: boolean
        default: false
      skip_missing:
        description: '允许缺包（过渡期用：仓库里还没有的包跳过并大声报出来，根会故意不完整）'
        required: false
        type: boolean
        default: false

jobs:
  # ★ job 的 id 只能是 ASCII（字母 / 数字 / - / _）——中文写在这里 GitHub 会
  #   直接判整个 workflow 文件无效（"workflow file issue"，不告诉你是哪一行）。
  #   中文放 name，它就会显示成「镜像 / 构建」。
  build:
    name: 建盘
    # ★ arm64 runner 只在【公开仓库】可用，私有仓库里会直接失败。
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 120

    env:
      FLAVOR: ${{ inputs.flavor }}
      ARCH: ${{ inputs.arch }}
      SIZE: ${{ inputs.size }}

    steps:
      - name: 取代码
        uses: actions/checkout@v7.0.1

      - name: 装 qemu（启动验证要用）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-arm qemu-efi-aarch64

      - name: 看一眼环境
        run: |
          echo "  docker: $(docker --version)"
          echo "  qemu:   $(qemu-system-$ARCH --version | head -1)"
          if [ -r /dev/kvm ]; then echo "  kvm:    有"; else echo "  kvm:    没有（退回 TCG 模拟，会慢）"; fi
          echo "  磁盘:   $(df -h / | tail -1 | awk '{print $4" 可用"}')"

      # ── 1. 装根：只认一个 apk 仓库 URL ─────────────────────────────────
      #
      # 不 checkout packages、不读它的 var/output/。这是两个仓库之间那条
      # 边界的全部内容：只有一个来源，"装出来的"和"发布的"就不可能不是
      # 同一个东西。
      - name: 装根（从 apk 仓库）
        env:
          SKIP: ${{ inputs.skip_missing }}
        run: |
          if [ "$SKIP" = "true" ]; then
            ./pantsu/pantsu rootfs "$FLAVOR" --arch "$ARCH" --skip-missing
          else
            ./pantsu/pantsu rootfs "$FLAVOR" --arch "$ARCH"
          fi

      # ── 2. 建盘 ───────────────────────────────────────────────────────
      # ── 验收：这个根真的能用 apk 装软件吗 ────────────────────────────────
      #
      # ★★ 为什么要有这一步。
      #
      #   「能启动」和「能装东西」是两件事，而【前者不蕴含后者】。实测漏过：
      #
      #     · 装根用的是【容器里】的 apk（apk add --root …），所以整条 CI 一路绿
      #     · 启动测试只看那句「欢迎来到」
      #     · 结果交付物里【根本没有 /sbin/apk】——盘能起来、能 SSH，装不了任何东西
      #
      #   中间没有任何一步会问「目标系统里有没有 apk」。build-time 用的工具和
      #   交付物里带的工具是两回事，而 CI 只验了前者。
      #
      # ★ 这一步是【在根里真的装一个包】，不是"检查文件在不在"：
      #
      #     apk --version          那个二进制跑得起来吗
      #     apk update             仓库可达、索引签名可信（不加 --allow-untrusted）
      #     apk add hello          真的装得进来
      #     hello                  装进来的东西跑得起来
      #
      #   顺带它把「仓库可达」和「公钥装对了」也一起验了——那两件事以前也只在
      #   组装侧验过，没在【目标根里】验过。
      - name: 验收 —— 这个根真能用 apk 装软件吗
        run: |
          set -euo pipefail
          ROOT="var/${{ inputs.flavor }}/rootfs-${{ inputs.arch }}"
          PWD_ABS="$PWD"

          echo "  根: $ROOT"
          if [ ! -x "$ROOT/sbin/apk" ]; then
            echo "  ✗ $ROOT/sbin/apk 不存在 —— 这个系统起来了也装不了任何东西"
            echo "      （多半是风味列表里漏了 apk-tools；它没有任何配方依赖，"
            echo "        不会被依赖带进来，只能显式声明）"
            exit 1
          fi
          echo "  ✓ /sbin/apk 在"

          # chroot 需要一个能解析的 /etc/resolv.conf，而最小根里没有。
          # 临时拷一份进去，验完删掉——这东西【不该】烤进交付物（那是首启该做的）。
          cp /etc/resolv.conf "$ROOT/etc/resolv.conf"

          if [ "${{ inputs.arch }}" != "$(uname -m | sed 's/arm64/aarch64/;s/x86_64/x86_64/')" ]; then
            echo "  ⚠ 宿主是 $(uname -m)，目标是 ${{ inputs.arch }} —— chroot 跑不了异构的二进制。"
            echo "     只验了 /sbin/apk 在不在；"真的能装"这一条要同架构的 runner 才验得了。"
            rm -f "$ROOT/etc/resolv.conf"
            exit 0
          fi

          echo
          echo "  ── apk 跑得起来吗 ──"
          sudo chroot "$ROOT" /sbin/apk --version

          echo
          echo "  ── 仓库可达 + 索引签名可信（不加 --allow-untrusted）──"
          sudo chroot "$ROOT" /sbin/apk update

          echo
          echo "  ── 真的装一个包 ──"
          sudo chroot "$ROOT" /sbin/apk add hello

          echo
          echo "  ── 装进来的东西跑得起来吗 ──"
          sudo chroot "$ROOT" /usr/bin/hello

          rm -f "$ROOT/etc/resolv.conf"
          echo
          echo "  ✓ 这个系统能用 apk 装软件"

      # ── 验收：真的能 SSH 进去吗 ──────────────────────────────────────────
      #
      # ★★ 为什么这一步必须有。
      #
      #   前面那句「sshd 已启动」是【它自己说的】——而真机上撞到的是：
      #   系统起来了、sshd 起来了、公钥也在 /root/.ssh/authorized_keys 里，
      #   **但钥匙被拒**：
      #
      #       root@…: Permission denied (publickey,password,keyboard-interactive)
      #
      #   原因在别处：/etc/shadow 里 root 的密码字段是 `!`（锁定），
      #   而 **sshd 对锁定账号拒绝一切认证，包括公钥**。
      #   那句注释写着"真机上安装器会设置 root 密码"——**而 DD 通道没有安装器**。
      #
      #   而"连不上"在一台云主机上就是变砖。
      #
      # ★ 验法是【真的连一次】：
      #
      #     ① 临时生成一把钥匙（私钥不进仓库、不进镜像、用完即弃）
      #     ② 公钥追加进根的 authorized_keys
      #     ③ 在 chroot 里跑【真的那个钩子】20-sshd
      #        —— 它会生成主机密钥、解开 root、起 sshd
      #     ④ 从宿主 ssh 进去跑一条命令
      #
      #   用 chroot 而不是 QEMU：快，而且**跑的是一模一样的那个钩子**。
      #   （QEMU 那条路验的是"能不能启动"，这条验的是"能不能登进去"——
      #     两件事，前面几个坑都是这种"两件事"。）
      - name: 验收 —— 真的能 SSH 进去吗
        run: |
          set -euo pipefail
          ROOT="var/${{ inputs.flavor }}/rootfs-${{ inputs.arch }}"

          echo "  ── ① 生成一把临时测试钥匙（用完即弃）──"
          ssh-keygen -t ed25519 -N '' -f /tmp/testkey -q
          echo "     $(ssh-keygen -l -f /tmp/testkey.pub)"

          echo
          echo "  ── ② 公钥放进根的 authorized_keys ──"
          install -d -m 700 "$ROOT/root/.ssh"
          cat /tmp/testkey.pub >> "$ROOT/root/.ssh/authorized_keys"
          chmod 600 "$ROOT/root/.ssh/authorized_keys"

          echo "  ── ③ chroot 里跑真的那个钩子 ──"
          # sshd 要用 /dev/null、/dev/urandom 这些，chroot 里没有现成的。
          for d in dev dev/pts proc; do sudo mount --bind "/$d" "$ROOT/$d"; done
          trap 'for d in proc dev/pts dev; do sudo umount -l "$ROOT/$d" 2>/dev/null || true; done' EXIT

          sudo chroot "$ROOT" /usr/lib/yojigen-os/boot.d/20-sshd || true
          sleep 1

          echo
          echo "  ── ④ 从宿主真的连一次 ──"
          # 钩子里起 sshd 用的端口是默认的 22；chroot 和宿主共享网络栈，
          # 所以直接连 127.0.0.1:22。CI runner 上 22 没别人占。
          if ssh -p 22 -i /tmp/testkey \
                 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o BatchMode=yes -o ConnectTimeout=15 \
                 root@127.0.0.1 'echo "      从里面回话：$(cat /etc/os-release | grep ^PRETTY_NAME)"' 2>&1; then
            echo
            echo "  ✓ 真的登进去了"
          else
            echo
            echo "  ✗ 连不上。查一下："
            echo "      shadow 里 root 是: $(sudo awk -F: '\$1=="root"{print \$2}' "$ROOT/etc/shadow")"
            echo "      authorized_keys:   $(sudo wc -l < "$ROOT/root/.ssh/authorized_keys") 行"
            echo "      sshd 在跑吗:       $(pgrep -a sshd || echo 没在跑)"
            exit 1
          fi

      - name: 建盘
        run: ./pantsu/pantsu img "$FLAVOR" --arch "$ARCH" --size "$SIZE"

      # ── 3. 启动一次（真正的验收）──────────────────────────────────────
      # ★ 第二句断言（「✓ 拿到地址」）为什么和第一句一样重要。
      #
      #   第一句验的是"它起来了"，第二句验的是"它连得上"。而这两件事
      #   没有蕴含关系——**起得来但连不上的系统，在云主机上就是一块砖**：
      #   没有串口，只剩 VNC，而 VNC 要控制台密码。
      #
      #   实测就漏过这一整条：镜子里没有 DHCP 客户端（连 ip 命令都没有），
      #   而 CI 一路绿——因为 QEMU 那边【根本没给虚拟机网卡】，
      #   被验的对象不存在，自然验不出问题。
      #
      #   `vm.py` 现在会加一块 user-mode 网卡，客户机走 DHCP 拿 10.0.2.15。
      - name: 启动一次（这一步才是验收）
        run: |
          ./pantsu/pantsu vm "$FLAVOR" --arch "$ARCH" \
              --serial-file /tmp/boot.log --timeout 600 \
              --expect "欢迎来到 Yojigen OS" \
          --expect "✓ 拿到地址"

      - name: 启动日志
        if: always()
        run: |
          echo "── 串口最后 60 行 ──"
          tail -60 /tmp/boot.log 2>/dev/null || echo "（没有串口日志）"

      # ── 4. 发布 ───────────────────────────────────────────────────────
      #
      # 用独立的 publish 动词而不是 img --publish：镜像刚刚已经建好并【启动
      # 验证过】了，这里不该再建一遍（建一遍要几分钟，而且理论上可能不是
      # 同一张——那正是"发布的"和"验过的"不该是两个东西的理由）。
      #
      # 环境变量和 packages/scripts/deploy.sh 是同一套（同一批组织级 secret）。
      - name: 发布到仓库
        if: ${{ inputs.deploy }}
        env:
          S3_AK: ${{ secrets.S3_AK }}
          S3_SK: ${{ secrets.S3_SK }}
          S3_BASE_URL: ${{ secrets.S3_BASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: ./pantsu/pantsu publish "$FLAVOR" --arch "$ARCH" --go

      - name: 留存镜像
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.flavor }}-${{ inputs.arch }}
          path: var/${{ inputs.flavor }}/*.img.zst
          if-no-files-found: warn

      - name: 写个总结
        if: always()
        run: |
          {
            echo "## 镜像：$FLAVOR / $ARCH"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 风味 | $FLAVOR |"
            echo "| 架构 | $ARCH |"
            echo "| 虚拟大小 | $SIZE |"
            echo "| 是否发布 | $([ "${{ inputs.deploy }}" = "true" ] && echo 是 || echo 否（干跑）) |"
            echo
            if [ -f "var/$FLAVOR/$FLAVOR-$ARCH.img.zst" ]; then
              echo "产物：\`$(du -h "var/$FLAVOR/$FLAVOR-$ARCH.img.zst" | cut -f1)\`"
            fi
            echo
            echo "DD 的时候："
            echo
            echo '```sh'
            echo "IMG=\$(curl -s https://repo.os.yojigen.cn/img/$FLAVOR/$ARCH/latest.txt)"
            echo "reinstall.sh dd --img https://repo.os.yojigen.cn/img/$FLAVOR/$ARCH/\$IMG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
